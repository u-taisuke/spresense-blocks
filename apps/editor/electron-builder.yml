appId: jp.ac.shohoku.spresense-blocks
productName: Spresense Blocks
directories:
  buildResources: build
  output: release
files:
  - out/**/*
# 「ゆる楽器」パックの音源WAV(apps/editor/resources/instrument-sounds/)を
# process.resourcesPath 配下にそのまま同梱する(asarには固めず、単純なファイルコピーとして展開する)。
# apps/editor/src/main/sdcard.ts の resolveAssetsRoot() がパッケージ後にこの場所を参照する。
extraResources:
  - from: resources
    to: resources
  # サンプル(.sprsb と一覧の samples.json)とチュートリアルを、アプリの「サンプル・使い方」画面と
  # メニューバーから開けるように同梱する。apps/editor/src/main/content.ts の resolveContentRoot() が
  # パッケージ後に process.resourcesPath/content/ を参照する。
  - from: ../../samples
    to: content/samples
    filter:
      - "*.sprsb"
      - samples.json
  - from: ../../docs/tutorial.md
    to: content/docs/tutorial.md
# arduino-cli 等の実行バイナリを同梱する場合や、files 経由で resources を含める場合に備えて、
# asar の外に展開されるよう asarUnpack の設定も残しておく(extraResources 自体は元々asarの外)。
asarUnpack:
  - resources/**
win:
  target: nsis
# 管理者権限が無い学校PCでもインストールできるよう、常にユーザー単位(perMachine: false)で
# インストールする。UAC昇格プロンプトを一切出さない("asInvoker"扱いになる)。
# oneClickではなくインストール先を選べるウィザードにして、挙動が分かりやすいようにしている。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
